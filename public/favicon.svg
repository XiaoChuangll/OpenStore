<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0B0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0B0B" stop-opacity="0" />
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0B0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0B0B" stop-opacity="0" />
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blurOuter" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blurInner" />
      <feMerge>
        <feMergeNode in="blurOuter" />
        <feMergeNode in="blurInner" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowColor" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feColorMatrix in="blur" type="matrix"
        values="0.7 0 0 0 0.15
                0 0.85 0 0 0.12
                0 0 1 0 0.2
                0 0 0 0.3 0" result="colored" />
      <feMerge>
        <feMergeNode in="colored" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!--
      修正：原来这里是 rect(14,14,212,212,r54)，比底板 rect(20,20,200,200,r48) 大一圈，
      四个渐隐矩形又铺到了裁剪边界，于是黑色渐隐会被渲染到底板外面，形成一圈圆角对不齐的暗色光晕。
      现在裁剪范围与底板完全一致，网格/渐隐都在底板内收边。
    -->
    <clipPath id="roundedClip">
      <rect x="20" y="20" width="200" height="200" rx="48" ry="48" />
    </clipPath>
  </defs>

  <!-- 圆角方形底板 -->
  <rect x="20" y="20" width="200" height="200" rx="48" ry="48"
        fill="#0B0B0B" />

  <!-- 贡献图网格 -->
