<?xml version="1.0" encoding="UTF-8"?>
<!--
  OpenStore 角标（独立文件版）。
     · 与 src/components/BrandMark.vue 是同一份几何，两处要保持一致。
     · 页面里的顶部导航 / 后台 / 登录页用的是那个内联组件（圆环取 currentColor、
       横线固定 #0A59F7）；本文件用于单独取用 / 下载 / 外部引用。
     · 圆环取接近 tile 底板的深色，横线是品牌蓝；放在浅色底上观感最好。
     · 几何（viewBox 0 0 100 100）：环心 (50,41)、半径 29、环宽 11；
       横线 y=89、x 26→74、宽 9、圆头。环下沿 74.5 与横线上沿 83.5 之间留 9 的间距
       （28px 下约 2.5px），再近就会糊成一团。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OpenStore">
  <g fill="none" stroke-linecap="round">
    <circle cx="50" cy="41" r="29" stroke="#0B0B0B" stroke-width="11"/>
    <path d="M26 89H74" stroke="#0A59F7" stroke-width="9"/>
  </g>
</svg>
